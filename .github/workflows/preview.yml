name: Preview Build
on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-preview:
    name: Build & Preview Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Code Analysis (Detekt)
        run: ./gradlew detekt --no-daemon

      - name: Get Current Version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          TAG="r$COMMIT_COUNT"
          VERSION_NAME="0.5.78"
          VERSION_CODE=$((578 + COMMIT_COUNT))
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Generate Code-Centric Context for AI
        run: |
          # Use the exact push range
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            RANGE="-n 1"
          fi
          
          # Get file change statistics (additions/deletions per file)
          FILE_CHANGES=$(git diff --stat $RANGE)
          
          # Get the actual code diff (limited to first 200 lines to avoid token limits)
          CODE_DIFF=$(git diff -U1 $RANGE | head -n 200)
          
          if [ -z "$FILE_CHANGES" ]; then FILE_CHANGES="Internal workflow or metadata updates."; fi
          
          echo "AI_CONTEXT<<EOF" >> $GITHUB_ENV
          echo "FILE STATISTICS (ADDITIONS/DELETIONS):" >> $GITHUB_ENV
          echo "$FILE_CHANGES" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "CODE DIFF SAMPLE:" >> $GITHUB_ENV
          echo "$CODE_DIFF" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Format Changelog with Groq AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          PROMPT="You are a professional release manager for AniZen. 
          Summarize exactly what was changed based ONLY on the code additions and deletions provided below. 
          Do NOT use commit messages. Do NOT mention previous history.
          Focus on the 'What' and 'Why' of the code changes.
          Group into 'Features', 'Fixes', and 'Adjustments'. Use simple bullets.
          
          CODE CONTEXT:
          $AI_CONTEXT"
          
          PAYLOAD=$(jq -n --arg prompt "$PROMPT" --arg model "groq/compound" '{
            model: $model,
            messages: [{role: "user", content: $prompt}],
            temperature: 0.1
          }')
          
          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
            SUMMARY="Internal code updates and refinements."
          fi
          
          echo "AI_CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build Preview APK
        run: ./gradlew assemblePreview -Pinclude-telemetry=false -Penable-updater=false -PabiList=arm64-v8a --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename & Filter APKs
        run: |
          cd app/build/outputs/apk/preview/
          found_v8a=false
          for f in *.apk; do
            if [[ "$f" == *"arm64-v8a"* ]]; then
              mv "$f" "AniZen-Preview-${{ env.TAG }}-arm64-v8a.apk"
              found_v8a=true
            else
              rm -f "$f"
            fi
          done
          if [ "$found_v8a" = false ]; then
            echo "Error: arm64-v8a APK not found!"
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-Preview-${{ env.TAG }}
          path: app/build/outputs/apk/preview/AniZen-Preview-${{ env.TAG }}-arm64-v8a.apk

      - name: Create Release in Preview Repo
        uses: softprops/action-gh-release@v1
        with:
          repository: salmanbappi/anizen-preview
          token: ${{ secrets.GH_PAT || github.token }}
          tag_name: ${{ env.TAG }}
          name: AniZen Preview ${{ env.TAG }}
          body: |
            ### AniZen Preview Build (${{ env.TAG }})
            
            ${{ env.AI_CHANGELOG }}
            
            ---
            **Version**: ${{ env.VERSION_NAME }}
            **Revision**: ${{ env.COMMIT_COUNT }}
            **Branch**: `preview`
          files: app/build/outputs/apk/preview/AniZen-Preview-${{ env.TAG }}-arm64-v8a.apk
          prerelease: false
          generate_release_notes: false
