name: Preview Build
on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-preview:
    name: Build & Preview Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Code Analysis (Detekt)
        run: ./gradlew detekt --no-daemon

      - name: Get Current Version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          TAG="r$COMMIT_COUNT"
          VERSION_NAME="0.5.78"
          VERSION_CODE=$((578 + COMMIT_COUNT))
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Generate Code-Centric Context for AI
        run: |
          # Use last tag or fallback to last 20 commits to ensure we capture changes after failures
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD~20..HEAD"
          else
            RANGE="$LAST_TAG..HEAD"
          fi
          
          # Get file change statistics
          FILE_CHANGES=$(git diff --stat $RANGE)
          
          # Get the actual code diff
          CODE_DIFF=$(git diff -U1 $RANGE | head -n 200)
          
          if [ -z "$FILE_CHANGES" ]; then FILE_CHANGES="Minor internal updates."; fi
          
          echo "AI_CONTEXT<<EOF" >> $GITHUB_ENV
          echo "ADDITIONS/DELETIONS:" >> $GITHUB_ENV
          echo "$FILE_CHANGES" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "CODE CHANGES:" >> $GITHUB_ENV
          echo "$CODE_DIFF" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Restore AI Note Accumulator
        uses: actions/cache/restore@v4
        with:
          path: .github/AI_NOTE_ACCUMULATOR
          key: ai-note-acc-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-note-acc-${{ github.ref_name }}-

      - name: Format Changelog with Groq AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Read the accumulator (failed notes from previous builds)
          ACCUMULATED_NOTES=""
          if [ -f .github/AI_NOTE_ACCUMULATOR ]; then
            ACCUMULATED_NOTES=$(cat .github/AI_NOTE_ACCUMULATOR)
          fi

          PROMPT="You are an excited team member of AniZen! Write a friendly and hyped 'Changelog' for our fans. 
          IMPORTANT: Below are NOTES FROM PREVIOUS FAILED BUILDS. 
          Please merge these into your summary of the NEW CHANGES so we don t lose any information about what was fixed/added during the failed attempts.
          
          PREVIOUS FAILED NOTES:
          $ACCUMULATED_NOTES
          
          NEW CHANGES (CONTEXT):
          $AI_CONTEXT"
          
          PAYLOAD=$(jq -n --arg prompt "$PROMPT" --arg model "groq/compound" '{
            model: $model,
            messages: [{role: "user", content: $prompt}],
            temperature: 0.7
          }')
          
          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
            SUMMARY="We've made some secret improvements under the hood to make your experience better! ✨"
          fi
          
          echo "AI_CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          mkdir -p .github && echo "$SUMMARY" > .github/AI_NOTE_ACCUMULATOR

      - name: Build Preview APK
        run: ./gradlew assemblePreview -Pinclude-telemetry=false -Penable-updater=false -PabiList=arm64-v8a --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename & Filter APKs
        run: |
          cd app/build/outputs/apk/preview/
          found_v8a=false
          for f in *.apk; do
            if [[ "$f" == *"arm64-v8a"* ]]; then
              mv "$f" "AniZen-Preview-${{ env.TAG }}-arm64-v8a.apk"
              found_v8a=true
            else
              rm -f "$f"
            fi
          done
          if [ "$found_v8a" = false ]; then
            echo "Error: arm64-v8a APK not found!"
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-Preview-${{ env.TAG }}
          path: app/build/outputs/apk/preview/AniZen-Preview-${{ env.TAG }}-arm64-v8a.apk

      - name: Reset Accumulator on Success
        if: success()
        run: mkdir -p .github && echo "" > .github/AI_NOTE_ACCUMULATOR

      - name: Persist Accumulator
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/AI_NOTE_ACCUMULATOR
          key: ai-note-acc-${{ github.ref_name }}-${{ github.run_id }}

      - name: Create Release in Preview Repo
        uses: softprops/action-gh-release@v1
        with:
          repository: salmanbappi/anizen-preview
          token: ${{ secrets.GH_PAT || github.token }}
          tag_name: ${{ env.TAG }}
          name: AniZen Preview ${{ env.TAG }}
          body: |
            ### 🌟 AniZen Preview Release (${{ env.TAG }})
            
            ${{ env.AI_CHANGELOG }}
            
            ---
            **Version**: ${{ env.VERSION_NAME }}
            **Revision**: ${{ env.COMMIT_COUNT }}
            **Branch**: `preview`
          files: app/build/outputs/apk/preview/AniZen-Preview-${{ env.TAG }}-arm64-v8a.apk
          prerelease: false
          generate_release_notes: false

      - name: Send Log to Discord
        if: success()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          # Define links
          RELEASE_URL="https://github.com/salmanbappi/anizen-preview/releases/tag/${{ env.TAG }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          
          # Use heredoc to preserve real newlines so Discord displays them correctly
          MESSAGE=$(cat <<EOF
          ### 🛠️ Preview Build Update (${{ env.TAG }})

          ${{ env.AI_CHANGELOG }}

          ---
          **📥 Download:** $RELEASE_URL
          **🔗 Commit:** $COMMIT_URL
          EOF
          )
          
          # Encode carefully using jq
          PAYLOAD=$(jq -n --arg msg "$MESSAGE" '{content: $msg}')
          
          curl -X POST -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
               -H "Content-Type: application/json" \
               -d "$PAYLOAD" \
               https://discord.com/api/v10/channels/1482262233227464714/messages
