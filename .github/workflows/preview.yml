name: Preview Build
on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - preview
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build & Preview Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Code Analysis (Detekt)
        run: ./gradlew detekt --no-daemon

      - name: Get Current Version
        id: get_version
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          VERSION_NAME=$(grep "versionName =" $GRADLE_FILE | sed 's/.*"\(.*\)".*/\1/')
          COMMIT_COUNT=$(git rev-list --count HEAD)
          FULL_VERSION="$VERSION_NAME-$COMMIT_COUNT"
          echo "VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "TAG=r$COMMIT_COUNT" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "COMMIT_COUNT=$COMMIT_COUNT" >> $GITHUB_ENV

      - name: Build Preview APK
        run: ./gradlew assemblePreview -Pinclude-telemetry=false -Penable-updater=false -PabiList=arm64-v8a --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/preview/
          find . -name "*universal*" -delete
          for f in *arm64-v8a*.apk; do
            mv "$f" "AniZen-${{ env.TAG }}.apk"
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniZen-Preview-${{ env.TAG }}
          path: app/build/outputs/apk/preview/*.apk
          retention-days: 7

      - name: Create Release in Preview Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: salmanbappi/anizen-preview
          token: ${{ secrets.GH_PAT || github.token }}
          tag_name: ${{ env.TAG }}
          name: AniZen Preview ${{ env.TAG }}
          body: |
            ### AniZen Preview Build (${{ env.TAG }})
            
            This is an automated preview build for testing purposes.
            
            **Version**: ${{ env.VERSION }}
            **Revision**: ${{ env.COMMIT_COUNT }}
            
            ---
            *Built from branch `preview`*
          files: app/build/outputs/apk/preview/*.apk
          prerelease: true
          make_latest: true
