name: Official Release
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-release:
    name: Build & Public Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Code Analysis (Detekt)
        run: ./gradlew detekt --no-daemon

      - name: Bump Version
        run: ./scripts/bump_version.sh

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ env.NEW_VN }}"
          git push origin master

      - name: Build Release APK
        run: ./gradlew assembleRelease -Pinclude-telemetry=false -Penable-updater=false --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          VERSION="${{ env.NEW_VN }}"
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            mv "$f" "AniZen-v$VERSION-$f"
          done

      - name: Generate Detailed Context for AI
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="-n 10"
          else
            RANGE="$PREV_TAG..HEAD"
          fi
          
          # 1. Get commits (subjects and bodies)
          COMMITS=$(git log $RANGE --pretty=format:"- %s%n%b" | grep -v "chore: bump version" || echo "New version release.")
          
          # 2. Get file change statistics
          DIFF_STATS=$(git diff --stat $RANGE)
          
          # 3. Get actual code diff
          CODE_DIFF=$(git diff -U1 $RANGE | head -n 200)
          
          echo "AI_CONTEXT<<EOF" >> $GITHUB_ENV
          echo "FILE STATISTICS:" >> $GITHUB_ENV
          echo "$DIFF_STATS" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "CODE CHANGES:" >> $GITHUB_ENV
          echo "$CODE_DIFF" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "COMMIT MESSAGES:" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Format Changelog with Groq AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          PROMPT="You are an excited team member of AniZen! Write a friendly and hyped 'Changelog' for our fans. 
          Looking at the code changes and commits below, explain WHAT IS NEW and WHAT CHANGED in a way that anyone can understand. 
          Use emojis like 🚀, ✨, and 🛠️. Group them into 'What's New', 'Fixed', and 'Polished'.
          CRITICAL: Do NOT mention 'code', 'commits', 'lines', or technical files. Just tell the story of the improvements!
          
          CONTEXT:
          $AI_CONTEXT"
          
          PAYLOAD=$(jq -n --arg prompt "$PROMPT" --arg model "groq/compound" '{
            model: $model,
            messages: [{role: "user", content: $prompt}],
            temperature: 0.7
          }')
          
          RESPONSE=$(curl -s -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          
          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          
          if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
            SUMMARY="We've made some secret improvements under the hood to make your experience better! ✨"
          fi
          
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VN }}
          name: AniZen Release v${{ env.NEW_VN }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 🚀 AniZen v${{ env.NEW_VN }}
            
            ${{ env.CHANGELOG }}
            
            ---
            **📥 Download:** Choose the `arm64-v8a` version for your phone.
