name: Official Release
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build & Public Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Code Analysis (Detekt)
        run: ./gradlew detekt --no-daemon

      - name: Bump Version
        run: ./scripts/bump_version.sh

      - name: Commit and Push Version Bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ env.NEW_VN }}"
          git push origin master

      - name: Build Release APK
        run: ./gradlew assembleRelease -Pinclude-telemetry=false -Penable-updater=false --no-daemon
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          VERSION="${{ env.NEW_VN }}"
          cd app/build/outputs/apk/release/
          for f in *.apk; do
            mv "$f" "AniZen-v$VERSION-$f"
          done

      - name: Generate Raw Changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # If no tags, get all commits
            CHANGELOG=$(git log --pretty=format:"* %s (%h)")
          else
            # Get commits since last tag, excluding the automated version bump
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"* %s (%h)" | grep -v "chore: bump version" || echo "No changes detected.")
          fi
          echo "RAW_CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Format Changelog with AI
        if: success()
        run: |
          # Clean up the changelog for JSON
          JSON_CHANGELOG=$(echo "$RAW_CHANGELOG" | jq -aRs .)
          
          # Call Gemini API
          RESPONSE=$(curl https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }} \
            -H 'Content-Type: application/json' \
            -X POST \
            -d "{
              \"contents\": [{
                \"parts\":[{
                  \"text\": \"Summarize these technical commits into a clear and professional 'Changelog' for an anime app. Group them into 'Features', 'Fixes', and 'Adjustments'. Keep the tone natural and human, avoid corporate jargon or excessive hype. Use simple bullet points. Commits: $JSON_CHANGELOG\"
                }]
              }]
            }")
          
          # Extract text and handle potential API errors
          SUMMARY=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' || echo "$RAW_CHANGELOG")
          
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.NEW_VN }}
          name: AniZen Release v${{ env.NEW_VN }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 🚀 AniZen v${{ env.NEW_VN }}
            
            ### 📝 Changelog
            ${{ env.CHANGELOG }}
            
            ---
            **📥 Download:** Choose the `arm64-v8a` version for your phone.
